<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvoicePro Loading</title>
<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  overflow: hidden;
}

.root {
  width: 100%;
  height: 100%;
  min-height: 100%;
  box-sizing: border-box;
  display: flex;
  align-items: stretch;
  justify-content: center;
  background: linear-gradient(135deg, #1f4037, #99f2c8);
  padding: 10px;
}

.card {
  width: 100%;
  max-width: 520px;
  height: 100%;
  max-height: 100%;
  box-sizing: border-box;
  padding: 0;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.97);
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  overflow: hidden;
}

/* Logo uses all space above the footer strip (full frame within the card) */
.logo-wrap {
  flex: 1 1 0;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 12px 4px;
  box-sizing: border-box;
}

.logo {
  display: block;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  object-position: center center;
  opacity: 0;
  animation: logoFade 1s ease forwards;
}

.bottom {
  flex: 0 0 auto;
  width: 100%;
  padding: 6px 14px 12px;
  box-sizing: border-box;
}

.title {
  margin: 0 0 2px;
  font-size: 18px;
  font-weight: 700;
  color: #0a7f5a;
  opacity: 0;
  animation: titleReveal 0.85s ease forwards;
  animation-delay: 0.9s;
}

.subtitle {
  margin: 0 0 8px;
  font-size: 11px;
  line-height: 1.3;
  color: #444;
  opacity: 0;
  animation: fadeIn 0.8s ease forwards;
  animation-delay: 1.6s;
}

.loader {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 3px solid rgba(10, 127, 90, 0.25);
  border-top-color: #0a7f5a;
  animation: spin 0.85s linear infinite;
  margin: 0 auto;
}

.msg {
  margin: 6px 0 0;
  font-size: 11px;
  color: #555;
  opacity: 0;
  animation: fadeIn 0.8s ease forwards;
  animation-delay: 1.9s;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes logoFade {
  from {
    opacity: 0;
    transform: scale(0.92);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes titleReveal {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>
<body>
<div class="root">
  <div class="card">
    <div class="logo-wrap">
      <img
        class="logo"
        src="./InvoicePro LOGO.png"
        alt="InvoicePro"
        decoding="async"
      />
    </div>
    <div class="bottom">
      <div class="title">InvoicePro</div>
      <div class="subtitle">Professional Invoice &amp; Billing Management</div>
      <div class="loader"></div>
      <div class="msg">Initializing…</div>
    </div>
  </div>
</div>
</body>
</html>
