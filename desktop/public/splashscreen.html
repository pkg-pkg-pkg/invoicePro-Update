<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVE InvoicePro 360 — Loading</title>
<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  overflow: hidden;
}

.root {
  width: 100%;
  height: 100%;
  min-height: 100%;
  box-sizing: border-box;
  display: flex;
  align-items: stretch;
  justify-content: center;
  background:
    radial-gradient(980px 460px at 78% 12%, rgba(118, 215, 255, 0.38), rgba(118, 215, 255, 0) 64%),
    radial-gradient(920px 420px at 20% 90%, rgba(93, 232, 132, 0.34), rgba(93, 232, 132, 0) 62%),
    linear-gradient(140deg, #063064 0%, #0c4ea1 34%, #0e6ed8 66%, #18a36f 100%);
  padding: 10px;
  position: relative;
}

.root::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.02) 42%, rgba(0, 0, 0, 0.18) 100%);
}

.card {
  width: 100%;
  max-width: 520px;
  height: 100%;
  max-height: 100%;
  box-sizing: border-box;
  padding: 0;
  border-radius: 18px;
  background: linear-gradient(164deg, rgba(255, 255, 255, 0.97), rgba(245, 251, 255, 0.92));
  border: 1px solid rgba(255, 255, 255, 0.56);
  box-shadow: 0 28px 72px rgba(3, 20, 48, 0.48);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

/* Logo uses all space above the footer strip (full frame within the card) */
.logo-wrap {
  flex: 1 1 0;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 12px 6px;
  box-sizing: border-box;
  background:
    radial-gradient(560px 220px at 50% 18%, rgba(110, 207, 255, 0.26), rgba(110, 207, 255, 0) 62%),
    radial-gradient(620px 240px at 50% 100%, rgba(51, 160, 255, 0.16), rgba(51, 160, 255, 0) 66%);
}

.logo {
  display: block;
  width: 96%;
  height: 96%;
  max-width: 420px;
  max-height: 300px;
  object-fit: contain;
  object-position: center center;
  opacity: 0;
  animation: logoFade 1s ease forwards;
}

.bottom {
  flex: 0 0 auto;
  width: 100%;
  padding: 8px 14px 10px;
  box-sizing: border-box;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(231, 246, 255, 0.78));
  border-top: 1px solid rgba(19, 94, 203, 0.12);
}

.title {
  margin: 0 0 1px;
  font-size: 32px;
  font-weight: 800;
  color: #114ea1;
  letter-spacing: 0.2px;
  line-height: 1.05;
  opacity: 0;
  animation: titleReveal 0.85s ease forwards;
  animation-delay: 0.9s;
}

.subtitle {
  margin: 0 0 7px;
  font-size: 10px;
  line-height: 1.3;
  color: #2c4a74;
  opacity: 0;
  animation: fadeIn 0.8s ease forwards;
  animation-delay: 1.6s;
}

.loader {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 3px solid rgba(20, 97, 217, 0.24);
  border-top-color: #16a36f;
  animation: spin 0.85s linear infinite;
  margin: 0 auto;
}

.msg {
  margin: 4px 0 0;
  font-size: 10px;
  color: #2f537f;
  opacity: 0;
  animation: fadeIn 0.8s ease forwards;
  animation-delay: 1.9s;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes logoFade {
  from {
    opacity: 0;
    transform: scale(0.92);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes titleReveal {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>
<body>
<div class="root">
  <div class="card">
    <div class="logo-wrap">
      <img
        class="logo"
        src="./InvoicePro LOGO.png"
        alt="PVE InvoicePro 360"
        decoding="async"
      />
    </div>
    <div class="bottom">
      <div class="title">PVE InvoicePro 360</div>
      <div class="subtitle">Professional GST billing</div>
      <div class="loader"></div>
      <div class="msg">Initializing…</div>
    </div>
  </div>
</div>
</body>
</html>
