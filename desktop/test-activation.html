<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoicePro - OTP Test</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #recaptcha-container {
            margin-bottom: 20px;
        }
        .error {
            color: red;
            background: #ffebee;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .success {
            color: green;
            background: #e8f5e8;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .step {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>InvoicePro - OTP Test</h2>
        
        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>
        
        <div class="step">
            <h3>Step 1: Mobile Number</h3>
            <div class="form-group">
                <label>Mobile Number:</label>
                <input type="tel" id="mobile" placeholder="+91XXXXXXXXXX" value="7549030630">
            </div>
            <button onclick="sendOTP()" id="sendBtn">Send OTP</button>
        </div>
        
        <div id="recaptcha-container"></div>
        
        <div class="step" id="otpSection" style="display: none;">
            <h3>Step 2: Enter OTP</h3>
            <div class="form-group">
                <label>OTP:</label>
                <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6">
            </div>
            <button onclick="verifyOTP()" id="verifyBtn">Verify OTP</button>
        </div>
        
        <div class="step" id="licenseSection" style="display: none;">
            <h3>Step 3: License Key</h3>
            <div class="form-group">
                <label>License Key:</label>
                <input type="text" id="licenseKey" placeholder="INVPRO0001">
            </div>
            <button onclick="activateLicense()">Activate</button>
        </div>
    </div>

    <script>
        // Firebase configuration - YOUR ACTUAL CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC8y6d-J9b-2dsQOEUyqvTMqNB1CayUodg",
            authDomain: "invoicepro-105ba.firebaseapp.com",
            projectId: "invoicepro-105ba",
            storageBucket: "invoicepro-105ba.firebasestorage.app",
            messagingSenderId: "282307321862",
            appId: "1:282307321862:web:56d30909e4a83023c7e387",
            measurementId: "G-NN4KW153ZH"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let confirmationResult = null;

        // Send OTP function
        window.sendOTP = async function() {
            const mobile = document.getElementById('mobile').value.trim();
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            
            if (!mobile) {
                errorDiv.textContent = 'Please enter mobile number';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                document.getElementById('sendBtn').disabled = true;
                document.getElementById('sendBtn').textContent = 'Sending...';

                // Format phone number
                const formattedPhone = mobile.startsWith('+') ? mobile : '+91' + mobile;

                // Create reCAPTCHA verifier
                window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                    'size': 'normal',
                    'callback': function(response) {
                        console.log('reCAPTCHA solved:', response);
                    }
                });

                // Send OTP
                confirmationResult = await auth.signInWithPhoneNumber(formattedPhone, window.recaptchaVerifier);
                
                successDiv.textContent = 'OTP sent successfully! Check your SMS.';
                successDiv.style.display = 'block';
                errorDiv.style.display = 'none';
                
                document.getElementById('otpSection').style.display = 'block';
                document.getElementById('sendBtn').style.display = 'none';

            } catch (error) {
                console.error('Send OTP error:', error);
                errorDiv.textContent = 'Failed to send OTP: ' + error.message;
                errorDiv.style.display = 'block';
                successDiv.style.display = 'none';
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('sendBtn').textContent = 'Send OTP';
            }
        };

        // Verify OTP function
        window.verifyOTP = async function() {
            const otp = document.getElementById('otp').value.trim();
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            
            if (!otp) {
                errorDiv.textContent = 'Please enter OTP';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                document.getElementById('verifyBtn').disabled = true;
                document.getElementById('verifyBtn').textContent = 'Verifying...';

                const result = await confirmationResult.confirm(otp);
                
                successDiv.textContent = 'OTP verified successfully!';
                successDiv.style.display = 'block';
                errorDiv.style.display = 'none';
                
                document.getElementById('licenseSection').style.display = 'block';
                document.getElementById('verifyBtn').style.display = 'none';

            } catch (error) {
                console.error('Verify OTP error:', error);
                errorDiv.textContent = 'Invalid OTP: ' + error.message;
                errorDiv.style.display = 'block';
                successDiv.style.display = 'none';
                document.getElementById('verifyBtn').disabled = false;
                document.getElementById('verifyBtn').textContent = 'Verify OTP';
            }
        };

        // Activate license function
        window.activateLicense = function() {
            const licenseKey = document.getElementById('licenseKey').value.trim();
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            
            if (!licenseKey) {
                errorDiv.textContent = 'Please enter license key';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                successDiv.textContent = 'License activated successfully! Redirecting to dashboard...';
                successDiv.style.display = 'block';
                errorDiv.style.display = 'none';

                // Here you would normally call your license activation API
                // For now, just show success
                setTimeout(() => {
                    alert('License activation complete!');
                }, 2000);

            } catch (error) {
                console.error('License activation error:', error);
                errorDiv.textContent = 'License activation failed: ' + error.message;
                errorDiv.style.display = 'block';
                successDiv.style.display = 'none';
            }
        };
    </script>
</body>
</html>
