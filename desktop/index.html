<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/invoicepro-logo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/invoicepro-logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/invoicepro-logo.png" />
    <link rel="apple-touch-icon" href="/invoicepro-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>PVE InvoicePro 360</title>
  </head>
  <body>
    <div id="root">
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          font-family: Inter, Segoe UI, sans-serif;
          color: #e2e8f0;
          background: #0b1628;
          gap: 12px;
        "
      >
        <div
          style="
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffc107;
            border-radius: 50%;
            animation: pve-spin 0.8s linear infinite;
          "
        ></div>
        <div style="font-size: 18px; font-weight: 600">Loading PVE InvoicePro 360…</div>
      </div>
    </div>
    <style>
      @keyframes pve-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div style="padding:32px;font-family:Segoe UI,sans-serif;background:#0b1628;color:#e2e8f0;max-width:640px;margin:0 auto;">' +
          '<h1 style="color:#ffc107;">App failed to start</h1>' +
          '<p>' + (e.message || 'Unknown error') + '</p>' +
          '<p style="color:#94a3b8;font-size:13px;">Open DevTools (Ctrl+Shift+I) for details, then restart with <code>npm run electron:dev</code>.</p></div>';
      });
      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.querySelector('[data-react-mounted]')) return;
        var hint = document.createElement('p');
        hint.style.cssText = 'color:#94a3b8;font-size:13px;margin-top:8px;text-align:center;';
        hint.textContent = 'Still loading? Check DevTools Console (Ctrl+Shift+I).';
        root.appendChild(hint);
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
